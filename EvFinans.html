<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ev Finans</title>
<style>
:root{
  --bg:#111927;--bg2:#151e2d;--bg3:#1c2a3a;--card:#1e2d3e;
  --border:#263244;--t1:#e8f0f8;--t2:#7a93a8;--t3:#3d5468;
  --teal:#4ecdc4;--orange:#f5a623;--green:#2ecc71;--red:#e74c3c;
  --blue:#3498db;--gold:#f0b429;
  --sp:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;max-width:480px;margin:0 auto;}
.nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(17,25,39,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:100;padding:8px 0;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 0;cursor:pointer;color:var(--t3);font-size:10px;gap:3px;}
.ni.on{color:var(--teal);}
.ni svg{width:24px;height:24px;fill:currentColor;}
.pg{display:none;padding-bottom:82px;min-height:100vh;}
.pg.on{display:block;}
.ph{display:flex;align-items:center;padding:13px var(--sp);background:rgba(17,25,39,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;gap:6px;}
.ph h1{font-size:17px;font-weight:600;flex:1;}
.hb-back{background:none;border:none;color:var(--teal);font-size:22px;cursor:pointer;padding:4px 2px;}
.hb-ic{background:none;border:none;color:var(--teal);font-size:22px;cursor:pointer;padding:4px 7px;}
.hb{background:none;border:none;color:var(--teal);font-size:13px;cursor:pointer;padding:7px 8px;}
.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:14px;}
.hid{display:none!important;}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:400;display:flex;align-items:center;justify-content:center;}
.mbox{background:var(--card);border-radius:22px;padding:21px 18px;width:93%;max-width:400px;}
.mtitle{font-size:16px;font-weight:700;margin-bottom:15px;text-align:center;}
.mlbl{font-size:11px;text-transform:uppercase;color:var(--t3);margin:11px 0 4px;}
.minput{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--t1);padding:12px 13px;border-radius:11px;font-size:14px;outline:none;}
.mbtns{display:flex;gap:10px;margin-top:15px;}
.mbtns button{flex:1;padding:13px;border-radius:11px;border:none;font-size:14px;font-weight:600;cursor:pointer;}
.bc{background:var(--bg3);color:var(--t2);}
.bk{background:var(--teal);color:white;}
.asback{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:350;display:flex;align-items:flex-end;justify-content:center;}
.asbox{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:10px 14px;}
.as-tit{font-size:12px;color:var(--t3);text-align:center;padding:5px 0 12px;border-bottom:1px solid var(--border);margin-bottom:9px;}
.asbtn{width:100%;padding:14px;border:none;border-radius:13px;font-size:14px;cursor:pointer;margin-bottom:8px;background:var(--card);color:var(--t1);text-align:left;display:flex;align-items:center;gap:12px;}
.ascancel{width:100%;padding:14px;border:none;border-radius:13px;font-size:14px;font-weight:700;cursor:pointer;background:var(--card);color:var(--teal);text-align:center;}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--green);color:white;padding:12px 24px;border-radius:13px;font-size:13px;font-weight:600;z-index:600;transition:transform .3s;}
.toast.show{transform:translateX(-50%) translateY(0);}
.stcard{background:var(--card);border-radius:15px;overflow:hidden;margin:10px var(--sp);}
.strow{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.stlbl{flex:1;font-size:14px;}
.starr{font-size:14px;color:var(--t3);}
.bsum{display:flex;gap:10px;padding:14px var(--sp);}
.bcard{flex:1;border-radius:16px;padding:14px 8px;text-align:center;}
.bcard.bg{background:linear-gradient(140deg,rgba(46,204,113,.22),rgba(46,204,113,.08));}
.bcard.br{background:linear-gradient(140deg,rgba(231,76,60,.22),rgba(231,76,60,.08));}
.bcard.bt{background:linear-gradient(140deg,rgba(52,152,219,.22),rgba(52,152,219,.08));}
.bcard-l{font-size:9px;text-transform:uppercase;margin-bottom:6px;}
.bcard-v{font-size:14px;font-weight:700;}
.bcard.bg .bcard-v{color:var(--green);}
.bcard.br .bcard-v{color:var(--red);}
.bcard.bt .bcard-v{color:var(--blue);}
.gtotal{margin:10px var(--sp);padding:20px;background:linear-gradient(135deg,var(--teal),var(--blue));border-radius:18px;text-align:center;}
.gtotal .gl{font-size:10px;opacity:.75;text-transform:uppercase;}
.gtotal .gv{font-size:32px;font-weight:700;margin-top:5px;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="asback hid" id="addTypeS">
  <div class="asbox">
    <div class="as-tit">İşlem Türü Seç</div>
    <button class="asbtn" onclick="openAddType('I')">🛒 Gider</button>
    <button class="asbtn" onclick="openAddType('G')">💰 Gelir</button>
    <button class="asbtn" onclick="openAddType('T')">↔️ Transfer</button>
    <button class="ascancel" onclick="closeAddType()">İptal</button>
  </div>
</div>

<div class="pg on" id="pg-calnd">
  <div class="ph"><button class="hb-back" onclick="goToday()">Bugün</button><h1 id="mTitle">Takvim</h1><button class="hb-ic" onclick="showPg('searc')">🔍</button><button class="hb-ic" onclick="showAddType()">＋</button></div>
  <div class="empty" id="calContent">Takvim içeriği</div>
</div>

<div class="pg" id="pg-searc">
  <div class="ph"><button class="hb-back" onclick="showPg('calnd')">‹</button><h1>Ara</h1><button class="hb" onclick="clearSearch()">Temizle</button></div>
  <div class="empty">Arama sonuçları</div>
</div>

<div class="pg" id="pg-hesap">
  <div class="ph"><h1>Bakiye</h1><button class="hb" onclick="showNewAcc()">+ Hesap</button><button class="hb-ic" onclick="showAddType()">＋</button></div>
  <div class="bsum"><div class="bcard bg"><div class="bcard-l">Kasa & Banka</div><div class="bcard-v" id="totalIncome">₺0</div></div><div class="bcard br"><div class="bcard-l">Kredi Kartı</div><div class="bcard-v" id="totalExpense">₺0</div></div><div class="bcard bt"><div class="bcard-l">Varlık</div><div class="bcard-v" id="totalAsset">₺0</div></div></div>
  <div class="gtotal"><div class="gl">NET TOPLAM</div><div class="gv" id="netTotal">₺0</div></div>
  <div id="hesapList"></div>
</div>

<div class="pg" id="pg-rapor">
  <div class="ph"><h1>Rapor</h1><button class="hb" onclick="showPg('budge')">🎯</button><button class="hb" onclick="showPg('netwr')">💎</button></div>
  <div class="empty">Rapor içeriği</div>
</div>

<div class="pg" id="pg-netwr">
  <div class="ph"><button class="hb-back" onclick="showPg('rapor')">‹</button><h1>Net Servet</h1></div>
  <div class="empty">Net servet bilgisi</div>
</div>

<div class="pg" id="pg-budge">
  <div class="ph"><button class="hb-back" onclick="showPg('rapor')">‹</button><h1>Bütçe</h1><button class="hb" onclick="showBudgetAdd()">+ Ekle</button></div>
  <div class="empty">Bütçe bilgisi</div>
</div>

<div class="pg" id="pg-setin">
  <div class="ph"><button class="hb-back" onclick="showPg('calnd')">‹</button><h1>Ayarlar</h1></div>
  <div class="stcard"><div class="strow" onclick="exportCSV()"><div class="stlbl">CSV Dışa Aktar</div><span class="starr">›</span></div><div class="strow" onclick="importCSVClick()"><div class="stlbl">CSV İçe Aktar</div><span class="starr">›</span></div><div class="strow" onclick="resetAllData()"><div class="stlbl" style="color:var(--red);">Tüm Verileri Sıfırla</div><span class="starr">›</span></div></div>
  <input type="file" id="csvInput" accept=".csv" style="display:none;">
</div>

<div class="nav">
  <div class="ni on" data-pg="calnd" onclick="showPg('calnd')"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg><span>Takvim</span></div>
  <div class="ni" data-pg="hesap" onclick="showPg('hesap')"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>Bakiye</span></div>
  <div class="ni" data-pg="rapor" onclick="showPg('rapor')"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>Rapor</span></div>
  <div class="ni" data-pg="setin" onclick="showPg('setin')"><svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg><span>Ayarlar</span></div>
</div>

<script>
let txs = [];
let custom = {};

function showPg(pg) {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
  document.getElementById('pg-' + pg).classList.add('on');
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('on'));
  let ni = document.querySelector('.ni[data-pg="' + pg + '"]');
  if (ni) ni.classList.add('on');
  if (pg === 'hesap') renderHesap();
}

function toast(msg) {
  let t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showAddType() { document.getElementById('addTypeS').classList.remove('hid'); }
function closeAddType() { document.getElementById('addTypeS').classList.add('hid'); }
function openAddType(type) { closeAddType(); toast(type + ' seçildi'); }
function goToday() { toast('Bugün seçildi'); }
function clearSearch() { toast('Arama temizlendi'); }
function showNewAcc() { toast('Yeni hesap ekleme'); }
function exportCSV() { toast('CSV dışa aktarıldı'); }
function importCSVClick() { document.getElementById('csvInput').click(); }
function resetAllData() { if (confirm('Tüm veriler silinsin mi?')) { localStorage.clear(); txs = []; renderHesap(); toast('Veriler sıfırlandı'); } }

function showBudgetAdd() {
  let cat = prompt('Kategori adı:');
  if (cat) toast(cat + ' bütçeye eklendi');
}

function renderHesap() {
  let total = 0, income = 0, expense = 0;
  txs.forEach(t => {
    if (t.type === 'income') { total += t.amount; income += t.amount; }
    else if (t.type === 'expense') { total -= t.amount; expense += t.amount; }
  });
  document.getElementById('totalIncome').innerHTML = '₺' + income.toFixed(2);
  document.getElementById('totalExpense').innerHTML = '₺' + expense.toFixed(2);
  document.getElementById('totalAsset').innerHTML = '₺0';
  document.getElementById('netTotal').innerHTML = '₺' + total.toFixed(2);
  let html = '<div class="empty">';
  if (txs.length === 0) html += 'Henüz işlem yok';
  else html += txs.length + ' işlem var';
  html += '</div>';
  document.getElementById('hesapList').innerHTML = html;
}

function init() {
  let stored = localStorage.getItem('evfinans_tx');
  if (stored) { try { txs = JSON.parse(stored); } catch(e) { txs = []; } }
  if (!txs || txs.length === 0) txs = [];
  renderHesap();
}

function saveData() { localStorage.setItem('evfinans_tx', JSON.stringify(txs)); }

document.addEventListener('DOMContentLoaded', function() {
  init();
  document.getElementById('csvInput').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (file) toast('CSV içe aktarılıyor: ' + file.name);
    this.value = '';
  });
});
</script>
</body>
</html>
